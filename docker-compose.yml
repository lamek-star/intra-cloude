# Private Data Cloud — Docker Compose Service Map (Phase 1)
#
# Exact image/runtime versions and the reasoning behind each are recorded
# in docs/architecture/DEPENDENCY_VERSIONS.md — update both together.
#
# Design rules encoded here (see docs/security/THREAT_MODEL.md and
# docs/architecture/ARCHITECTURE.md Section 4):
#   - Only `proxy` publishes a port on the host.
#   - postgres-control, postgres-tenant, redis (Valkey), and object-storage
#     are reachable only on the internal "data" network.
#   - backend/worker/beat/frontend sit on the internal "app" network and
#     talk to `proxy` for host-facing traffic.
#
# NOT YET VERIFIED end-to-end (`docker compose up`) — this development
# environment does not have Docker installed. Each image/build has been
# checked for internal consistency (env vars, health check commands,
# dependency ordering) but not run together. Verify as an early Phase 2
# step; fix forward from whatever `docker compose up` surfaces.

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  pg_control_data:
  pg_tenant_data:
  object_storage_data:
  valkey_data:
  caddy_data:

services:
  proxy:
    image: caddy:2-alpine
    ports:
      # Bind to the host's specific LAN interface IP (set via PROXY_BIND_ADDRESS),
      # not 0.0.0.0, so the service is reachable from the private network but not
      # accidentally exposed if the host also has a public interface. For a
      # single-NIC dev machine reachable only on a private LAN/VPN, set
      # PROXY_BIND_ADDRESS to that host's LAN IP (or 127.0.0.1 for local-only access).
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:8443:443"
    environment:
      # Hostnames the internal CA issues a cert for — must include however
      # you actually address this host (see infrastructure/proxy/Caddyfile).
      PROXY_TLS_HOSTNAMES: ${PROXY_TLS_HOSTNAMES:-localhost 127.0.0.1}
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - edge
      - app
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - app
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app
      - data
    depends_on:
      postgres-control:
        condition: service_healthy
      postgres-tenant:
        condition: service_healthy
      valkey:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./apps/backend
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config worker -l info
    networks:
      - app
      - data
    depends_on:
      postgres-control:
        condition: service_healthy
      postgres-tenant:
        condition: service_healthy
      valkey:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./apps/backend
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config beat -l info
    networks:
      - app
      - data
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  postgres-control:
    image: postgres:18
    environment:
      POSTGRES_DB: ${CONTROL_DB_NAME}
      POSTGRES_USER: ${CONTROL_DB_USER}
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # PostgreSQL 18+ official images store data using version-specific
      # subdirectories under /var/lib/postgresql itself (pg_ctlcluster-style
      # layout) — mounting a volume at the old .../data path causes the
      # entrypoint to refuse to start. Confirmed by actually running this
      # stack; see docs/architecture/DEPENDENCY_VERSIONS.md.
      - pg_control_data:/var/lib/postgresql
    networks:
      - data
    restart: unless-stopped

  postgres-tenant:
    image: postgres:18
    environment:
      POSTGRES_DB: ${TENANT_DB_NAME}
      POSTGRES_USER: ${TENANT_DB_USER}
      POSTGRES_PASSWORD: ${TENANT_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_tenant_data:/var/lib/postgresql
    networks:
      - data
    restart: unless-stopped

  # Valkey (BSD-licensed, Redis-protocol-compatible) — see ADR-0011.
  # Service name kept as `valkey`; REDIS_URL env var name kept for client
  # library familiarity.
  valkey:
    image: valkey/valkey:9-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - valkey_data:/data
    networks:
      - data
    restart: unless-stopped

  object-storage:
    image: minio/minio:latest # pin to a specific digest before production use — see docs/architecture/DEPENDENCY_VERSIONS.md
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - object_storage_data:/data
    networks:
      - data
    restart: unless-stopped
    # Console (port 9001) is intentionally not published to the host here;
    # access it via an SSH tunnel or a LAN-only admin route if needed.
