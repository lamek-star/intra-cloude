# Private Data Cloud — Docker Compose Service Map (Phase 1)
#
# Exact image/runtime versions and the reasoning behind each are recorded
# in docs/architecture/DEPENDENCY_VERSIONS.md — update both together.
#
# Design rules encoded here (see docs/security/THREAT_MODEL.md and
# docs/architecture/ARCHITECTURE.md Section 4):
#   - Only `proxy` publishes a port on the host.
#   - postgres-control, postgres-tenant, redis (Valkey), and object-storage
#     are reachable only on the internal "data" network.
#   - backend/worker/beat/frontend sit on the internal "app" network and
#     talk to `proxy` for host-facing traffic.
#
# Verified end-to-end via `docker compose up --build` (2026-08-19): all
# nine services build and reach a healthy state — postgres-control,
# postgres-tenant, valkey, object-storage, backend, worker, beat,
# frontend, and proxy (Caddy obtains its internal-CA certificate and
# serves correctly). The full backend test suite (246 tests) passes
# against these live containers, not mocks. If you hit a proxy port
# conflict on 8443, that's a host-level port collision with whatever
# else is already bound to it, not a problem with this file.

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  pg_control_data:
  pg_tenant_data:
  object_storage_data:
  valkey_data:
  caddy_data:
  pdc_backups:
  clamav_data:

services:
  proxy:
    image: caddy:2-alpine
    ports:
      # Bind to the host's specific LAN interface IP (set via PROXY_BIND_ADDRESS),
      # not 0.0.0.0, so the service is reachable from the private network but not
      # accidentally exposed if the host also has a public interface. For a
      # single-NIC dev machine reachable only on a private LAN/VPN, set
      # PROXY_BIND_ADDRESS to that host's LAN IP (or 127.0.0.1 for local-only access).
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:8443:443"
    environment:
      # Hostnames the internal CA issues a cert for — must include however
      # you actually address this host (see infrastructure/proxy/Caddyfile).
      PROXY_TLS_HOSTNAMES: ${PROXY_TLS_HOSTNAMES:-localhost 127.0.0.1}
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - edge
      - app
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - app
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
    # backend/worker/beat all build from the identical Dockerfile/context
    # but Compose gives each service its own image tag by default — a
    # rebuild of one silently left the others stale (found by actually
    # running the worker: it had no tasks registered because its image
    # predated apps/imports/tasks.py). Sharing one explicit tag means
    # building any one of the three refreshes what all three run.
    image: pdc-backend:latest
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      # Backup dumps (system/backups.py, Phase 11) — a named volume by
      # default; point BACKUP_DIR-backing storage at an off-host/NAS mount
      # in production per docs/operations/BACKUP_RESTORE.md Section 4
      # (a Docker named volume alone is not off-host backup).
      - pdc_backups:/backups
    networks:
      - app
      - data
    depends_on:
      postgres-control:
        condition: service_healthy
      postgres-tenant:
        condition: service_healthy
      valkey:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./apps/backend
    image: pdc-backend:latest
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config worker -l info
    volumes:
      - pdc_backups:/backups
    networks:
      - app
      - data
    depends_on:
      postgres-control:
        condition: service_healthy
      postgres-tenant:
        condition: service_healthy
      valkey:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./apps/backend
    image: pdc-backend:latest
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config beat -l info
    volumes:
      - pdc_backups:/backups
    networks:
      - app
      - data
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  postgres-control:
    image: postgres:18
    environment:
      POSTGRES_DB: ${CONTROL_DB_NAME}
      POSTGRES_USER: ${CONTROL_DB_USER}
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # PostgreSQL 18+ official images store data using version-specific
      # subdirectories under /var/lib/postgresql itself (pg_ctlcluster-style
      # layout) — mounting a volume at the old .../data path causes the
      # entrypoint to refuse to start. Confirmed by actually running this
      # stack; see docs/architecture/DEPENDENCY_VERSIONS.md.
      - pg_control_data:/var/lib/postgresql
    networks:
      - data
    restart: unless-stopped

  postgres-tenant:
    image: postgres:18
    environment:
      POSTGRES_DB: ${TENANT_DB_NAME}
      POSTGRES_USER: ${TENANT_DB_USER}
      POSTGRES_PASSWORD: ${TENANT_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_tenant_data:/var/lib/postgresql
    networks:
      - data
    restart: unless-stopped

  # Valkey (BSD-licensed, Redis-protocol-compatible) — see ADR-0011.
  # Service name kept as `valkey`; REDIS_URL env var name kept for client
  # library familiarity.
  valkey:
    image: valkey/valkey:9-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - valkey_data:/data
    networks:
      - data
    restart: unless-stopped

  object-storage:
    image: minio/minio:latest # pin to a specific digest before production use — see docs/architecture/DEPENDENCY_VERSIONS.md
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - object_storage_data:/data
    networks:
      - data
    restart: unless-stopped
    # Console (port 9001) is intentionally not published to the host here;
    # access it via an SSH tunnel or a LAN-only admin route if needed.

  # Optional malware-scan daemon for uploaded files (storage/scanning.py,
  # Section 33 of the master prompt). Not started by default — this
  # service is only pulled in when an operator runs
  # `docker compose --profile malware-scan up -d` (or lists it
  # explicitly), and MALWARE_SCAN_ENABLED must also be set to True for
  # the backend to actually use it. backend/worker are deliberately NOT
  # given a `depends_on` on this service: leaving scanning off is a
  # supported, visible configuration state (uploads simply aren't
  # scanned), not something that should block the rest of the stack
  # from starting.
  clamav:
    image: clamav/clamav:stable
    profiles: ["malware-scan"]
    healthcheck:
      test: ["CMD-SHELL", "echo PING | timeout 5 nc -w 5 localhost 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      # The virus definition database download on first start can take
      # a while — don't flag it unhealthy while that's in progress.
      start_period: 180s
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - data
    restart: unless-stopped
