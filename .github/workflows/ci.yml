name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres-control:
        image: postgres:18
        env:
          POSTGRES_DB: pdc_control_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      postgres-tenant:
        image: postgres:18
        env:
          POSTGRES_DB: pdc_tenant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CONTROL_DB_HOST: localhost
      CONTROL_DB_PORT: 5432
      TENANT_DB_HOST: localhost
      TENANT_DB_PORT: 5433
      REDIS_URL: redis://localhost:6379/0
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_ROOT_USER: pdc-ci-root-user
      OBJECT_STORAGE_ROOT_PASSWORD: pdc-ci-root-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Not a `services:` entry: GitHub Actions services are started via
      # a plain `docker create <image>` with no way to append a command
      # (services don't support `command:`), and MinIO's image just
      # prints its usage and exits if not told `server /data` — verified
      # by actually running it that way. Starting it as a regular step
      # sidesteps that entirely. Previously this job had no MinIO at
      # all, so storage/tests/test_storage.py's real boto3 calls had no
      # local target to hit — the README's "229 tests pass against real
      # PostgreSQL/MinIO/Celery, not mocks" claim wasn't actually true of
      # this pipeline as committed.
      - name: Start MinIO
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=pdc-ci-root-user \
            -e MINIO_ROOT_PASSWORD=pdc-ci-root-password \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && break
            sleep 2
          done

      # The runner's default postgresql-client (16.x on ubuntu-latest) is
      # older than the postgres:18 service containers above. pg_dump
      # refuses to run against a newer server ("aborting because of
      # server version mismatch") — confirmed as the real cause of every
      # system/tests/test_backups.py failure on a real GitHub Actions
      # run, not a hypothetical. PGDG's apt repo (following their own
      # documented install steps) provides postgresql-client-18;
      # installing it alongside the stock 16 package registers it with
      # a higher update-alternatives priority, so /usr/bin/pg_dump and
      # /usr/bin/pg_restore resolve to 18 without touching the app code.
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version
          pg_restore --version

      - name: Install dependencies
        run: pip install -r apps/backend/requirements/dev.txt

      - name: Ruff
        working-directory: apps/backend
        run: ruff check .

      - name: Mypy
        working-directory: apps/backend
        run: mypy .

      - name: pip-audit (dependency vulnerability scan)
        working-directory: apps/backend
        run: pip-audit -r requirements/base.txt -r requirements/prod.txt

      - name: Pytest
        # Run from the repo root (not apps/backend) so tests/security/
        # (cross-app tenant-isolation tests) are collected alongside each
        # app's own tests/ — see pytest.ini at the repo root.
        run: pytest --cov=apps/backend --cov-report=term-missing

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build before Type check, not after: Next.js 16 generates
      # PageProps/LayoutProps as global ambient types into
      # .next/types/**/*.ts (tsconfig.json includes that path) as a
      # side effect of `next build`/`next dev` — running `tsc --noEmit`
      # before anything has ever built the app leaves those types
      # undefined. Confirmed for real: this was the actual cause of the
      # standing "Cannot find name 'PageProps'" CI failures on master
      # going back to at least Phase 12, caught by actually checking
      # `gh run list` against real GitHub Actions runs rather than only
      # trusting local Docker-based verification.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Type check
        run: npx tsc --noEmit
