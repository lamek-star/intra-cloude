name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres-control:
        image: postgres:18
        env:
          POSTGRES_DB: pdc_control_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      postgres-tenant:
        image: postgres:18
        env:
          POSTGRES_DB: pdc_tenant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CONTROL_DB_HOST: localhost
      CONTROL_DB_PORT: 5432
      TENANT_DB_HOST: localhost
      TENANT_DB_PORT: 5433
      REDIS_URL: redis://localhost:6379/0
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_ROOT_USER: pdc-ci-root-user
      OBJECT_STORAGE_ROOT_PASSWORD: pdc-ci-root-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Not a `services:` entry: GitHub Actions services are started via
      # a plain `docker create <image>` with no way to append a command
      # (services don't support `command:`), and MinIO's image just
      # prints its usage and exits if not told `server /data` — verified
      # by actually running it that way. Starting it as a regular step
      # sidesteps that entirely. Previously this job had no MinIO at
      # all, so storage/tests/test_storage.py's real boto3 calls had no
      # local target to hit — the README's "229 tests pass against real
      # PostgreSQL/MinIO/Celery, not mocks" claim wasn't actually true of
      # this pipeline as committed.
      - name: Start MinIO
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=pdc-ci-root-user \
            -e MINIO_ROOT_PASSWORD=pdc-ci-root-password \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Install dependencies
        run: pip install -r apps/backend/requirements/dev.txt

      - name: Ruff
        working-directory: apps/backend
        run: ruff check .

      - name: Mypy
        working-directory: apps/backend
        run: mypy .

      - name: pip-audit (dependency vulnerability scan)
        working-directory: apps/backend
        run: pip-audit -r requirements/base.txt -r requirements/prod.txt

      - name: Pytest
        # Run from the repo root (not apps/backend) so tests/security/
        # (cross-app tenant-isolation tests) are collected alongside each
        # app's own tests/ — see pytest.ini at the repo root.
        run: pytest --cov=apps/backend --cov-report=term-missing

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
